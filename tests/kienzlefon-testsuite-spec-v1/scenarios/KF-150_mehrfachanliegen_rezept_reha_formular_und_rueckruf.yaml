    möchte dazu gern mit dem Arzt sprechen.
  instructions:
  - Nenne persönliche Daten nur auf Nachfrage.
  - Bleibe bei den genannten Anliegen.
environment:
  caller_id: '+491760050150'
  within_phone_hours: false
test_goal:
  topic: Allgemeinmedizinischer Routinefall
  clarification_goal: Anliegen vollständig und ohne Halluzinationen in den passenden Workflow bringen.
expectations:
