        - Bisoprolol 5 mg
  - type: rueckruf_details
    complete: true
    data:
      vorname: *id001
      nachname: *id002
      geburtsdatum: *id003
      grund:
        contains: Reha
  required_behaviors:
  - Rezept und ärztliche Rücksprache zu Reha-Unterlagen als getrennte Aufträge führen.
  forbidden_behaviors:
  - Aus dem Reha-Antrag ein erfundenes Spezialformular-Backend behaupten.
  notes: []
