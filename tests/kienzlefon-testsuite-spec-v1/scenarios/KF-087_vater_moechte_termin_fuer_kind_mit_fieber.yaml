  seed: 1087
patient:
  identity:
    first_name: Barbara
    last_name: Koch
    birth_date: 19.01.1996
    callback_number: null
  persona:
    style: hilfsbereit, leicht besorgt
    disclosure: teilweise_spontan
    quirks: []
  facts:
    reason: Fieber seit gestern, sonst stabil
    availability: heute wenn möglich
    caller_name: Thomas Schulz
    patient_name: Barbara Koch
    patient_birth_date: 19.01.1996
  opening: Ich brauche für meine Tochter einen Termin, sie hat seit gestern Fieber, ist aber wach und trinkt.
  instructions:
  - Du bist der/die Angehörige Thomas Schulz.
  - Du rufst ausdrücklich für Barbara Koch an.
  - Wenn nach Patientendaten gefragt wird, nenne die Daten der Zielperson, nicht deine eigenen.
  - Wenn nach deinem Namen als Anrufer gefragt wird, nenne Thomas Schulz.
environment:
  caller_id: '+491760050087'
