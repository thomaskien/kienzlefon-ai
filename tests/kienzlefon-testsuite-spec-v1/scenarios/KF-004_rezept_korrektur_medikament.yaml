  required_behaviors:
  - Die Korrektur als letzte gültige Medikamentenangabe übernehmen.
  - Die Gesprächszusammenfassung darf die vorherige verworfene Angabe erwähnen.
  forbidden_behaviors:
  - Metoprolol zusätzlich als bestelltes Medikament speichern.
  notes: []
