    dyspnea: keine schwere akute Atemnot
    caller_name: Herr König
    patient_name: Holger Frank
    patient_birth_date: 23.08.1941
  opening: Hier ist der Pflegedienst. Holger Frank hat in vier Tagen drei Kilo zugenommen und deutlich dickere Beine,
    aktuell aber keine schwere Atemnot. Wir möchten Rücksprache.
  instructions:
  - Du bist Pflegefachkraft Herr König.
  - Du rufst für Holger Frank an, nicht für dich selbst.
  - Gib Patientendaten auf Nachfrage korrekt an.
  - Bitte um ärztliche Rücksprache.
environment:
  caller_id: '+492331880134'
