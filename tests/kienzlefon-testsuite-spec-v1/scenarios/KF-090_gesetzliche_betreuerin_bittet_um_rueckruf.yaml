format_version: '1.0'
scenario_id: KF-090
title: Gesetzliche Betreuerin bittet um Rückruf
description: Angehöriger ruft für einen Patienten mit anderem Namen an; Zuordnung darf nicht auf den Anrufernamen
  kippen.
enabled: true
channels:
- telephone
- chat
tags:
- angehoerige
- fremdanrufer
- patientenzuordnung
- gesetzliche_betreuerin_bittet_um_rueckruf
simulation:
  max_turns: 24
  seed: 1090
patient:
  identity:
    first_name: Rainer
    last_name: Braun
    birth_date: 25.04.1953
    callback_number: null
  persona:
    style: hilfsbereit, leicht besorgt
    disclosure: teilweise_spontan
    quirks: []
  facts:
    reason: Medikamentenänderung besprechen
    relationship: gesetzliche Betreuerin
    caller_name: Katrin Vogel
    patient_name: Rainer Braun
    patient_birth_date: 25.04.1953
  opening: Hier ist die gesetzliche Betreuerin von Herrn Müller. Ich müsste eine Medikamentenänderung mit dem Arzt
    besprechen.
  instructions:
  - Du bist der/die Angehörige Katrin Vogel.
  - Du rufst ausdrücklich für Rainer Braun an.
  - Wenn nach Patientendaten gefragt wird, nenne die Daten der Zielperson, nicht deine eigenen.
  - Wenn nach deinem Namen als Anrufer gefragt wird, nenne Katrin Vogel.
environment:
  caller_id: '+491760050090'
  within_phone_hours: false
test_goal:
  topic: Angehörigenanruf
  clarification_goal: Anrufer und Patient korrekt auseinanderhalten und das Anliegen dem Patienten zuordnen.
expectations:
  terminal_outcome: order_complete
  records:
  - type: rueckruf_details
    complete: true
    data:
      vorname:
        equals: Rainer
      nachname:
        equals: Braun
      geburtsdatum:
        equals: 25.04.1953
      grund:
        contains: Medikament
  required_behaviors:
  - Patientenidentität von der Identität des anrufenden Angehörigen trennen.
  - Im medizinischen Auftrag die Daten der Zielperson verwenden.
  forbidden_behaviors:
  - Den Namen des Angehörigen als Patientennamen speichern.
  - Ohne Anlass behaupten, der Angehörige sei selbst Patient.
  notes: []
