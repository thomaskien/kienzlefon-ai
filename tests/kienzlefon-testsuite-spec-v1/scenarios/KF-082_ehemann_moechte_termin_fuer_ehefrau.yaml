    quirks: []
  facts:
    availability: Dienstag oder Donnerstag vormittags
    reason: Knieschmerzen
    caller_name: Rolf Seidel
    patient_name: Hans Reuter
    patient_birth_date: 18.12.1961
  opening: Ich möchte für meine Frau einen Termin machen, sie hat seit Wochen Knieschmerzen.
  instructions:
  - Du bist der/die Angehörige Rolf Seidel.
  - Du rufst ausdrücklich für Hans Reuter an.
  - Wenn nach Patientendaten gefragt wird, nenne die Daten der Zielperson, nicht deine eigenen.
  - Wenn nach deinem Namen als Anrufer gefragt wird, nenne Rolf Seidel.
environment:
  caller_id: '+491760050082'
